<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercadinho Seu João | Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="login-page">
    <div class="decor decor-top-left" aria-hidden="true"></div>
    <div class="decor decor-bottom-right" aria-hidden="true"></div>

    <section class="brand-panel" aria-label="Apresentação do Mercadinho Seu João">
      <div class="brand-identity" aria-label="Mercadinho Seu João">
        <div class="brand-basket" aria-hidden="true">
          <img src="assets/logo.png" alt="Mercadinho Seu João" />
        </div>
      </div>

      <div class="store-illustration hidden-illustration" aria-hidden="true">
        <svg viewBox="0 0 460 245" role="presentation" focusable="false">
          <path d="M37 142c20-59 73-103 145-109 85-8 149 30 192 77 21 23 28 52 8 76-23 28-72 44-125 47-61 4-126-3-175-25-42-18-63-46-45-66Z" fill="#F3E6D8" />
          <ellipse cx="231" cy="211" rx="185" ry="14" fill="#EADBCB" />

          <rect x="155" y="68" width="151" height="95" rx="18" fill="#F3E3D3" />
          <path d="M142 73h178l-14 25H156l-14-25Z" fill="#F2D1B2" opacity="0.28" />
          <path d="M137 73h188l-10 24H147l-10-24Z" fill="#F0C59D" opacity="0.24" />

          <path d="M146 67h168c4 0 7 3 7 7v19H139V74c0-4 3-7 7-7Z" fill="#EE8E4F" />
          <path d="M146 67h24v26h-24z" fill="#F7C9A6" />
          <path d="M170 67h24v26h-24z" fill="#F2A870" />
          <path d="M194 67h24v26h-24z" fill="#EE8E4F" />
          <path d="M218 67h24v26h-24z" fill="#F7C9A6" />
          <path d="M242 67h24v26h-24z" fill="#F2A870" />
          <path d="M266 67h24v26h-24z" fill="#EE8E4F" />
          <path d="M290 67h24v26h-24z" fill="#F7C9A6" />
          <path d="M146 92c5 8 20 12 36 12 15 0 30-4 34-12 5 8 20 12 36 12 15 0 30-4 34-12 5 8 20 12 36 12 10 0 21-2 28-7v28H139V85c5 4 11 7 18 7 10 0 21-2 28-7 5 8 20 12 36 12 15 0 30-4 34-12Z" fill="#E7A96F" opacity="0.08" />

          <rect x="160" y="114" width="61" height="96" rx="7" fill="#E0997B" />
          <rect x="233" y="116" width="96" height="84" rx="6" fill="#EDD9C6" />
          <rect x="239" y="130" width="84" height="4" rx="2" fill="#D9C1A9" />
          <rect x="239" y="157" width="84" height="4" rx="2" fill="#D9C1A9" />
          <rect x="239" y="184" width="84" height="4" rx="2" fill="#D9C1A9" />

          <g>
            <rect x="247" y="137" width="12" height="15" rx="3" fill="#E5BCA0" />
            <rect x="262" y="137" width="12" height="15" rx="3" fill="#D9A98A" />
            <rect x="277" y="137" width="12" height="15" rx="3" fill="#E5BCA0" />
            <rect x="247" y="164" width="12" height="15" rx="3" fill="#D9A98A" />
            <rect x="262" y="164" width="12" height="15" rx="3" fill="#E5BCA0" />
            <rect x="277" y="164" width="12" height="15" rx="3" fill="#D9A98A" />
          </g>

          <circle cx="213" cy="170" r="3" fill="#F3E6D8" />

          <rect x="94" y="144" width="83" height="44" rx="4" fill="#E3C6A8" />
          <rect x="98" y="148" width="75" height="5" rx="2.5" fill="#D6B58F" opacity="0.55" />
          <rect x="98" y="157" width="75" height="5" rx="2.5" fill="#D6B58F" opacity="0.55" />
          <circle cx="121" cy="135" r="14" fill="#EE9B5A" />
          <circle cx="148" cy="138" r="14" fill="#EE9B5A" />
          <path d="M113 124c2 0 6 1 8 5" stroke="#8FB06B" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M140 126c2 1 5 3 7 7" stroke="#8FB06B" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M111 123l-7-4" stroke="#8FB06B" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M139 125l7-4" stroke="#8FB06B" stroke-width="3" stroke-linecap="round" fill="none" />

          <g fill="none" stroke="#A8826A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M338 140h31l11 23H338Z" />
            <path d="M333 131h13l7 9" />
            <path d="M342 146h28" />
            <path d="M346 153h24" />
            <path d="M351 159h18" />
            <path d="M355 166h11" />
            <path d="M350 140v23" />
            <path d="M360 140v23" />
            <path d="M370 140v23" />
            <circle cx="344" cy="177" r="7" />
            <circle cx="372" cy="177" r="7" />
          </g>
        </svg>
      </div>
    </section>

    <section class="login-card" aria-label="Cadastro de usuário">
      <form id="register-form" class="login-form" action="index.html" method="get">
        <header class="card-header">
          <h1>Criar sua conta</h1>
          <p>Preencha os dados abaixo para começar a usar o sistema do Mercadinho Seu João.</p>
        </header>

        <div class="field-group">
          <label for="register-name">Nome completo</label>
          <div class="field-shell">
            <span class="field-icon field-icon-left" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.75" />
                <path d="M5 19c1.5-3 4.3-4.5 7-4.5s5.5 1.5 7 4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <input id="register-name" name="register-name" type="text" autocomplete="name" placeholder="Digite seu nome completo" />
          </div>
        </div>

        <div class="field-group">
          <label for="register-role">Cargo</label>
          <div class="field-shell select-shell">
            <span class="field-icon field-icon-left" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M7 9.5a5 5 0 0 1 10 0v1A5 5 0 0 1 7 10.5v-1Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M6 18.5h12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
                <path d="M9 20.5h6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
              </svg>
            </span>
            <select id="register-role" name="register-role" aria-label="Cargo">
              <option value="" selected>Selecione o cargo</option>
              <option value="DONO">Dono</option>
              <option value="FUNCIONARIO">Funcionário</option>
            </select>
            <span class="select-chevron" aria-hidden="true">⌄</span>
          </div>
        </div>

        <div class="field-group">
          <label for="register-user">E-mail ou nome de usuário</label>
          <div class="field-shell">
            <span class="field-icon field-icon-left" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.75" />
                <path d="M4.5 7.5 12 13l7.5-5.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <input id="register-user" name="register-user" type="text" autocomplete="username" placeholder="Digite seu e-mail ou nome de usuário" />
          </div>
        </div>

        <div class="field-group field-group-password">
          <label for="register-password">Senha</label>
          <div class="field-shell">
            <span class="field-icon field-icon-left" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.75" />
                <path d="M8 10V8a4 4 0 0 1 8 0v2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <input id="register-password" name="register-password" type="password" autocomplete="new-password" placeholder="Digite sua senha" />
            <button class="password-toggle" type="button" aria-label="Mostrar senha" data-password-toggle>
              <span class="field-icon" aria-hidden="true" data-eye-off>
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
                  <path d="M10.6 10.6A3 3 0 0 0 13.4 13.4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M6.5 6.8C4.7 8.1 3.4 9.9 2.7 12c1.9 5.2 6.1 8 9.3 8 1 0 2-.2 3-.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M14.6 5.2c3.1.9 5.8 3.2 7.1 6.8-.8 2.2-2.1 4-3.9 5.3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
              <span class="field-icon is-hidden" aria-hidden="true" data-eye>
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M2.8 12c1.8-4.7 6-8 9.2-8s7.4 3.3 9.2 8c-1.8 4.7-6 8-9.2 8S4.6 16.7 2.8 12Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.75" />
                </svg>
              </span>
            </button>
          </div>
        </div>

        <div class="field-group field-group-password">
          <label for="register-password-confirm">Confirmar senha</label>
          <div class="field-shell">
            <span class="field-icon field-icon-left" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.75" />
                <path d="M8 10V8a4 4 0 0 1 8 0v2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <input id="register-password-confirm" name="register-password-confirm" type="password" autocomplete="new-password" placeholder="Confirme sua senha" />
            <button class="password-toggle" type="button" aria-label="Mostrar senha" data-password-toggle>
              <span class="field-icon" aria-hidden="true" data-eye-off>
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
                  <path d="M10.6 10.6A3 3 0 0 0 13.4 13.4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M6.5 6.8C4.7 8.1 3.4 9.9 2.7 12c1.9 5.2 6.1 8 9.3 8 1 0 2-.2 3-.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M14.6 5.2c3.1.9 5.8 3.2 7.1 6.8-.8 2.2-2.1 4-3.9 5.3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
              <span class="field-icon is-hidden" aria-hidden="true" data-eye>
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M2.8 12c1.8-4.7 6-8 9.2-8s7.4 3.3 9.2 8c-1.8 4.7-6 8-9.2 8S4.6 16.7 2.8 12Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.75" />
                </svg>
              </span>
            </button>
          </div>
        </div>

        <button class="submit-button" type="submit">
          <span>Cadastrar</span>
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M5 12h12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            <path d="M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="divider" aria-hidden="true">
          <span></span>
          <strong>Ou</strong>
          <span></span>
        </div>

        <button class="secondary-button" type="button" onclick="window.location.href='index.html'">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M9 7V5.8A1.8 1.8 0 0 1 10.8 4h7.4A1.8 1.8 0 0 1 20 5.8v12.4A1.8 1.8 0 0 1 18.2 20h-7.4A1.8 1.8 0 0 1 9 18.2V17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M15 12H4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
            <path d="m8 8 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Já tem uma conta? Entrar</span>
        </button>
      </form>
    </section>
  </main>

  <link rel="stylesheet" href="css/feedback.css" />
  <script src="js/feedback.js"></script>
  <script src="main.js"></script>
</body>
</html>
